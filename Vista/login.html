<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERIAS</title>
    <link rel="stylesheet" href="../Assets/css/estilos.css">
</head>

<body>

    <div>

        <form id="login-form" action="" method="post">
            <legend>INICIAR SESION</legend>

            <div class="grupo-input">
                <label for="email">Ingresar el Email:</label>
                <input type="email" id="email" required placeholder="ejemplo: Admin@gmail.com">
            </div>

            <div class="grupo-input">
                <label for="password">Ingresar Contraseña:</label>
                <input type="password" id="password" required placeholder="ejemplo: ********">
            </div>

            <div class="grupo-botones">
                <button type="submit">Iniciar Sesion</button>
            </div>
            <div class="crear-cuenta">
                <p>¿No tienes una cuenta? <a href="registro.html">Crear cuenta</a></p>
            </div>

        </form>

    </div>

    <script src="../Controlador/Login.js"></script>
</body>

</html>

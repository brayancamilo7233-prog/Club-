<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/club.css">
    <title>CLUB ACERIAS - Mi perfil</title>
</head>

<body>
    <div class="header-mr d-flex flex-wrap gap-2 justify-content-between align-items-center p-3 shadow-sm">
        <h3>CLUB ACERIAS</h3>
        <a href="Dashboart.html" class="btn btn-light btn-sm"><i class="bi bi-arrow-left"></i> Volver al panel</a>
    </div>

    <div class="container py-4">
        <form id="formPerfil" action="../Modelo/guardarAsociado.php" method="post">
            <fieldset>
                <legend><i class="bi bi-file-person"></i> Mi perfil - Acerias</legend>

                <div class="campos row g-3 mx-0">
                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="documento">Ingresar el Documento:</label>
                            <input type="number" id="documento" name="documento" required
                                placeholder="ejemplo: 1119150888">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="nombres">Ingresar el Nombre:</label>
                            <input type="text" id="nombres" name="nombres" required
                                placeholder="ejemplo: Camila Andrea">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="apellidos">Ingresar el Apellido:</label>
                            <input type="text" id="apellidos" name="apellidos" required
                                placeholder="ejemplo: Angarita Soto">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="fechaNacimiento">Ingresar la Fecha de Nacimiento:</label>
                            <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="grupo-input" role="radiogroup" aria-labelledby="tituloGenero">
                            <span id="tituloGenero" class="titulo-opciones">Ingresar el Género:</span>
                            <div class="opciones">
                                <label>
                                    <input type="radio" name="genero" value="Masculino" required>
                                    <span>Masculino</span>
                                </label>
                                <label>
                                    <input type="radio" name="genero" value="Femenino">
                                    <span>Femenino</span>
                                </label>
                                <label>
                                    <input type="radio" name="genero" value="otro">
                                    <span>Otro</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="direccionResidencia">Ingresar la Dirección:</label>
                            <input type="text" id="direccionResidencia" name="direccionResidencia" required
                                placeholder="ejemplo: cra 13 #3-21">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="ciudad">Ingresar la Ciudad:</label>
                            <select id="ciudad" name="ciudad" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="sogamoso">Sogamoso</option>
                                <option value="duitama">Duitama</option>
                                <option value="tunja">Tunja</option>
                                <option value="nobsa">Nobsa</option>
                                <option value="cerinza">Cerinza</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="telefono">Ingresar el Teléfono:</label>
                            <input type="tel" id="telefono" name="telefono" required
                                placeholder="ejemplo: 3112607209">
                        </div>
                    </div>

                    <div class="col-md-6">
                        <div class="grupo-input">
                            <label for="email">Ingresar el Email:</label>
                            <input type="email" id="email" name="email" required
                                placeholder="ejemplo: nombre@correo.com">
                        </div>
                    </div>
                </div>

                <div class="grupo-botones">
                    <button type="submit">Guardar</button>
                    <button type="reset">Limpiar</button>
                </div>
                <p id="mensajeRegistro" role="status" aria-live="polite"></p>
            </fieldset>
        </form>
    </div>
    <script src="../Config/Asociados.js"></script>
</body>

</html>

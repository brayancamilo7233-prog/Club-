<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Assets/css/club.css">
    <title>Mi perfil | Club Acerías</title>
</head>

<body class="registration-body">
    <nav class="navbar navbar-dark club-navbar">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="Dashboart.html"><i class="bi bi-shield-check me-2"></i>Club Acerías</a>
        </div>
    </nav>

    <main class="container page-content">
        <div class="page-heading">
            <a class="back-link" href="Dashboart.html"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
            <span class="eyebrow d-block mt-4">MI CUENTA</span>
            <h1 class="h2 fw-bold mt-2"><i class="bi bi-person-badge me-2"></i>Mi perfil</h1>
            <p class="text-secondary mb-0">Revisa y actualiza tus datos personales y de contacto.</p>
        </div>

        <section class="card form-card">
            <div class="card-body">
                <form id="formPerfil" class="club-form" action="../Modelo/guardarAsociado.php" method="post">
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label for="documento" class="form-label">Documento</label>
                            <input type="number" id="documento" name="documento" class="form-control" required
                                placeholder="Ejemplo: 1119150888">
                        </div>

                        <div class="col-md-6">
                            <label for="nombres" class="form-label">Nombres</label>
                            <input type="text" id="nombres" name="nombres" class="form-control" autocomplete="given-name" required
                                placeholder="Ejemplo: Camila Andrea">
                        </div>

                        <div class="col-md-6">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" id="apellidos" name="apellidos" class="form-control" autocomplete="family-name" required
                                placeholder="Ejemplo: Angarita Soto">
                        </div>

                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label">Fecha de nacimiento</label>
                            <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="form-control" required>
                        </div>

                        <div class="col-12">
                            <div role="radiogroup" aria-labelledby="tituloGenero">
                                <span id="tituloGenero" class="form-label">Género</span>
                                <div class="opciones-genero">
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="generoMasculino" name="genero" value="Masculino" required>
                                        <label class="form-check-label" for="generoMasculino">Masculino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="generoFemenino" name="genero" value="Femenino">
                                        <label class="form-check-label" for="generoFemenino">Femenino</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" id="generoOtro" name="genero" value="otro">
                                        <label class="form-check-label" for="generoOtro">Otro</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="direccionResidencia" class="form-label">Dirección</label>
                            <input type="text" id="direccionResidencia" name="direccionResidencia" class="form-control" autocomplete="street-address" required
                                placeholder="Ejemplo: Cra. 13 # 3-21">
                        </div>

                        <div class="col-md-6">
                            <label for="ciudad" class="form-label">Ciudad</label>
                            <select id="ciudad" name="ciudad" class="form-select" required>
                                <option value="" selected disabled>Seleccionar...</option>
                                <option value="sogamoso">Sogamoso</option>
                                <option value="duitama">Duitama</option>
                                <option value="tunja">Tunja</option>
                                <option value="nobsa">Nobsa</option>
                                <option value="cerinza">Cerinza</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" id="telefono" name="telefono" class="form-control" autocomplete="tel" required
                                placeholder="Ejemplo: 3112607209">
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">Correo electrónico</label>
                            <input type="email" id="email" name="email" class="form-control" autocomplete="email" required
                                placeholder="nombre@correo.com">
                        </div>
                    </div>

                    <div class="form-actions mt-4">
                        <button class="btn btn-primary px-4" type="submit"><i class="bi bi-check2-circle me-2"></i>Guardar</button>
                        <button class="btn btn-outline-secondary px-4" type="reset"><i class="bi bi-eraser me-2"></i>Limpiar</button>
                    </div>
                    <p id="mensajeRegistro" class="form-mensaje mt-4 mb-0" role="status" aria-live="polite"></p>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div>
    </footer>
    <script src="../Config/Asociados.js"></script>
</body>

</html>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | Club Acerías</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../Assets/css/club.css" rel="stylesheet">
</head>
<body class="registration-body">
  <header class="d-flex flex-wrap justify-content-between align-items-center gap-2 px-4 py-3 bg-white shadow-sm">
    <h1 class="h3 m-0"><a class="text-reset text-decoration-none" href="Dashboart.html" title="Volver al panel principal">CLUB ACERIAS - Reportes</a></h1>
    <div class="d-flex align-items-center gap-2">
      <span>
        <i class="bi bi-person-circle"></i>
        <span id="usuarioActual">Usuario</span>
        <span id="rolActual" class="badge text-bg-secondary ms-1"></span>
      </span>
      <button id="btnCerrarSesion" class="btn btn-danger btn-sm" type="button">
        <i class="bi bi-box-arrow-right"></i> Cerrar sesión
      </button>
    </div>
  </header>
  <main class="container page-content">
    <div class="page-heading">
      <a class="back-link" href="Dashboart.html"><i class="bi bi-arrow-left me-1"></i>Volver al panel</a>
      <span class="eyebrow d-block mt-4">MÓDULO DE REPORTES</span>
      <h1 class="h2 fw-bold mt-2">Reportes del club</h1>
      <p class="text-secondary mb-0">Elige un reporte, filtra por fechas y guárdalo para abrirlo en Excel.</p>
    </div>

    <section class="card form-card">
      <div class="card-body p-4 p-md-5">
        <form id="formReportes" class="club-form" novalidate>
          <div class="row g-4">
            <div class="col-12">
              <label for="tipo" class="form-label">Reporte</label>
              <select id="tipo" name="tipo" class="form-select">
                <option value="asociados" selected>Asociados (por fecha de ingreso)</option>
                <option value="actividades">Actividades (por fecha)</option>
                <option value="pagos">Pagos (por fecha de pago)</option>
                <option value="prestamos">Préstamos (por fecha de solicitud)</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="desde" class="form-label">Desde</label>
              <input id="desde" name="desde" class="form-control" type="date">
            </div>
            <div class="col-md-6">
              <label for="hasta" class="form-label">Hasta</label>
              <input id="hasta" name="hasta" class="form-control" type="date">
            </div>
          </div>
          <div class="form-actions mt-4">
            <button id="guardarReporte" class="btn btn-primary px-4" type="submit" disabled><i class="bi bi-check2-circle me-2"></i>Guardar</button>
            <button class="btn btn-outline-secondary px-4" type="reset"><i class="bi bi-eraser me-2"></i>Limpiar</button>
          </div>
          <div id="mensajeReportes" class="alert alert-danger mt-4 mb-0 d-none" role="alert"></div>
        </form>

        <p class="form-note mt-3 mb-0"><i class="bi bi-info-circle me-1"></i>Guardar descarga el reporte elegido con las fechas indicadas.</p>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="container py-4 text-center text-secondary small">Club Acerías · Sistema de gestión</div></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Config/Reportes.js"></script>
  <script src="../Config/Dashboart.js"></script>
</body>
</html>
